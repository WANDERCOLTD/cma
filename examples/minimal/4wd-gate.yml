name: 4wd-gate

# Runs the 4wd gate + ratchet check on every PR + push to main.
# Generated by `/4wd:init --with-gha` (shell/generic stack).
#
# This is the minimal flavour — install whatever tooling your gate command needs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: 4wd-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Gate
        run: bash run-tests.sh    # ← edit to match your gate.command
      - name: Ratchet
        run: bash scripts/check-ratchet.sh
