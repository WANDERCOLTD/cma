name: cma-gate

# Runs the cma gate + ratchet check on every PR + push to main.
# Generated by `/cma:init --with-gha` (Node stack).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: cma-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: npm ci
      - name: Gate
        run: npm test
      - name: Ratchet
        run: bash scripts/check-ratchet.sh
