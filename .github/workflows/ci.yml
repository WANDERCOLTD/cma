name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Run shellcheck
        run: |
          find bin lib scripts -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -f gcc

  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install jq (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install jq

      - name: Install jq (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up bats-core
        run: |
          if [ ! -d test/bats-core ]; then
            git clone --depth 1 https://github.com/bats-core/bats-core.git test/bats-core
            git clone --depth 1 https://github.com/bats-core/bats-assert.git test/bats-assert
            git clone --depth 1 https://github.com/bats-core/bats-support.git test/bats-support
          fi

      - name: Run BATS
        run: |
          test/bats-core/bin/bats --print-output-on-failure --formatter tap test/*.bats

  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [shellcheck, bats]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Check ratchet
        run: bash scripts/check-ratchet.sh
